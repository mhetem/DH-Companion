name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  WAILS_VERSION: v3.0.0

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Wails v3 compiles its GTK4/WebKitGTK cgo on Linux whatever the build tags — v2
      # only did under the ones `wails build` passed — so even vet needs the headers.
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # main.go embeds frontend/dist, which is gitignored and so absent on a clean
      # checkout — without this, package main won't compile and vet dies before the
      # tests run. Go tests never read these assets, and the build jobs below compile
      # against the real thing on all three platforms, so a placeholder is enough
      # here. The all: prefix is what makes a lone dotfile satisfy the pattern.
      - name: Placeholder for the embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./... -race

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # The same three steps as the release, minus packaging: bindings, frontend, then
      # the production binary.
      - name: Build
        shell: bash
        run: |
          wails3 generate bindings -i -clean=true
          npm --prefix frontend ci
          npm --prefix frontend run build
          if [ "$RUNNER_OS" = "Windows" ]; then
            CGO_ENABLED=0 go build -tags production -trimpath -buildvcs=false -ldflags "-w -s -H windowsgui" -o build/bin/DH-Companion.exe
          else
            go build -tags production -trimpath -buildvcs=false -ldflags "-w -s" -o build/bin/DH-Companion
          fi
